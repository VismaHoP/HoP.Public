# hop.secrets.job — initialises / rotates HoP secrets.
#
# Run order:
#   1. kubectl apply -f pg_ecr.yaml          (postgres)
#   2. hop-secrets-database doesn't exist yet — create it as an empty placeholder first (this Job
#      is the only thing that ever writes it for real), then start database. It runs migrations,
#      then CrashLoopBackOffs on the placeholder — expected, do NOT wait for Ready here:
#        kubectl get secret hop-secrets-database >/dev/null 2>&1 || \
#          kubectl create secret generic hop-secrets-database --from-literal='appsettings.Secrets.json={}'
#        kubectl apply -f h2o.app.database.yaml
#   3. kubectl apply -f hop.secrets.job.yaml  (waits for migrations, generates/rotates secrets, syncs DB)
#   4. kubectl wait --for=condition=complete job/hop-secrets-job --timeout=300s && \
#      kubectl rollout restart deployment/database && \
#      kubectl rollout status deployment/database --timeout=300s
#   5. kubectl apply -k .                     (start all remaining microservices)
#
# On upgrade: re-running requires deleting the previous Job first — a Job's spec.template is
# immutable, and re-applying an unchanged manifest is a no-op (it will NOT re-run or rotate
# anything). Before redeploying the services:
#   kubectl delete job hop-secrets-job --ignore-not-found --wait
#   kubectl apply -f hop.secrets.job.yaml
# The Job itself is idempotent once it runs — it rotates all secrets and re-encrypts DB rows.
#
# After the Job completes, restart already-running migrated services — subPath mounts never
# refresh live pods. Selected by actual Secret mount, not a name list, so it can't drift and
# naturally skips ftg/authadfs and unrelated namespace tenants. Job has no RBAC on deployments:
#   kubectl get deployments -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.volumes[*].secret.secretName}{"\n"}{end}' \
#     | awk '/hop-secrets-/ {print $1}' \
#     | xargs -r -n1 kubectl rollout restart deployment
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hop-secrets-job
imagePullSecrets:
  - name: awsecr-cred
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hop-secrets-manager
rules:
  # create can't be scoped by resourceNames (k8s RBAC limitation) — deployment invariant:
  # this namespace must not contain any other ServiceAccount with broader RBAC than this one.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames:
      - hop-secrets-apikey-history
      - hop-secrets-gateway
      - hop-secrets-auth
      - hop-secrets-database
      - hop-secrets-licence
      - hop-secrets-menu
      - hop-secrets-webrouter
      - hop-secrets-elmar
      - hop-secrets-antra
      - hop-secrets-image
      - hop-secrets-feedback
      - hop-secrets-settings
      - hop-secrets-absencecalendar
      - hop-secrets-attachment
      - hop-secrets-clientapplications
      - hop-secrets-department
      - hop-secrets-freeform
      - hop-secrets-horcalendar
      - hop-secrets-metainvoicelist
      - hop-secrets-metainvoicesubmit
      - hop-secrets-payslip
      - hop-secrets-persondata
      - hop-secrets-report
      - hop-secrets-staff
      - hop-secrets-task
      - hop-secrets-taskmetainvoice
      - hop-secrets-taskhomeinventory
      - hop-secrets-vacation
      - hop-secrets-antralicence
      - hop-secrets-payout
      - hop-secrets-matreslist
      - hop-secrets-taskmatres
      - hop-secrets-contract
      - hop-secrets-horweb
      - hop-secrets-businesstrip
      - hop-secrets-stockwriteoff
      - hop-secrets-worktimeplanning
      - hop-secrets-worktimetracking
      - hop-secrets-advanceexpense
      - hop-secrets-training
      - hop-secrets-workplace
      - hop-secrets-notification
      - hop-secrets-taskeinventory
      - hop-secrets-mhe
      - hop-secrets-order
      - hop-secrets-acquaint
      - hop-secrets-hrreport
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hop-secrets-manager
subjects:
  - kind: ServiceAccount
    name: hop-secrets-job
roleRef:
  kind: Role
  name: hop-secrets-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hop-secrets-job
spec:
  backoffLimit: 10
  # Deliberately no ttlSecondsAfterFinished: a re-run is always an explicit
  # `kubectl delete job hop-secrets-job && kubectl apply -f ...`, so there's never more than one
  # finished Job around to clean up — and this Job only logs to console (no external log
  # shipping), so the finished Pod is the only place its logs survive until someone deletes it.
  template:
    spec:
      serviceAccountName: hop-secrets-job
      restartPolicy: OnFailure
      containers:
        - name: hop-secrets-job
          image: ${registryURL}/hop.k8s.secrets:1
          env:
            - name: PG_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: hop-secrets-job
                  key: PgConnectionString
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hop-secrets-job
data:
  PgConnectionString: ''
