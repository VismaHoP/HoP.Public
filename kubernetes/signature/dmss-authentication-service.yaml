---
# ConfigMap for application.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmss-authentication-service
data:
  application.yml: |
    server:
      port: 8089
    digidoc4j:
      configuration:
        mode: PROD
        file: classpath:digidoc4j-custom.yaml
        preferAiaOcsp: true
        issuers:
    smartId:
      hostUrl: https://rp-api.smart-id.com/v3/
      relyingPartyUUID: ${relyingPartyUUID}
      relyingPartyName: ${relyingPartyName}
      delay: 3000
      trustedCertificates: classpath:trusted_certificates.jks
      trustAnchorsCertificates: classpath:sid_trusted_CA.jks
      schemaName: smart-id
      interactions:
        type: confirmationMessageAndVerificationCodeChoice
        display-text: ${displayText}
    lvrtc:
      authUri: https://eidas.eparaksts.lv/trustedx-authserver/oauth/lvrtc-eipsign-as
      resourcesUri: https://eidas.eparaksts.lv/trustedx-resources/openid/v1/users/me
      clientId: ${clientId}
      clientSecret: ${clientSecret}
      redirectUri: ${signaturePersonUrl}/api/lvrtc-signing/
      acrValues: urn:eparaksts:authentication:flow:mobileid
      scope: "urn:lvrtc:fpeil:aa"
      locale: lv
    hazelcast:
      expireInminutes: 3
      members: localhost:5776
      port: 5776
      useMulticastConfig: false
      useTcpIpConfig: false
      kubernetes:
        enabled: true
        service-dns: dmss-authentication-service.default.svc.cluster.local
    logging:
      pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}/%X{spanId}] %-5p [%t] %logger{36} - %msg%n'
      level:
        root: DEBUG
        # Keep always debug
        ee.digitalmind: DEBUG
        # Suppress other noisy loggers
        org.apache.coyote.http11: INFO
        org.apache.tomcat: INFO
        org.apache.catalina: INFO
        com.hazelcast.spi.impl.operationservice.impl.InvocationMonitor: INFO
        org.springframework.web.servlet: INFO
        org.apache.http.impl.conn.PoolingHttpClientConnectionManager: INFO
        com.trustlynx.autoconfigure.RequestTracingFilter: INFO
        com.hazelcast.internal.partition.InternalPartitionService: INFO
        com.hazelcast.internal.cluster.impl.MembershipManager: INFO
    spring:
      sleuth:
        propagation:
          type: B3
      zipkin:
        enabled: false
    management:
      tracing:
        enabled: false
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmss-authentication-service
  labels:
    app: dmss-authentication-service
spec:
  selector:
    matchLabels:
      app: dmss-authentication-service
  template:
    metadata:
      labels:
        app: dmss-authentication-service
    spec:
      containers:
      - name: dmss-authentication-service
        image: trustlynx/dmss-authentication-service:26.0.2
        env:
        - name: SPRING_CONFIG_LOCATION
          value: /confs/application.yml
        - name: TZ
          value: Europe/Riga
        volumeMounts:
        - name: config
          mountPath: /confs/application.yml
          subPath: application.yml
      volumes:
      - name: config
        configMap:
          name: dmss-authentication-service
---
apiVersion: v1
kind: Service
metadata:
  name: dmss-authentication-service
  labels:
    app: dmss-authentication-service
spec:
  type: ClusterIP
  ports:
  - port: 8089
  selector:
    app: dmss-authentication-service
---
