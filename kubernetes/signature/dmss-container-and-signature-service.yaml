---
# ConfigMap for application.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmss-container-and-signature-service
data:
  application.yml: |
    server:
      port: 8092
    management:
      tracing:
        enabled: false
    spring:
      servlet:
        multipart:
          maxFileSize: 1000MB
          maxRequestSize: 1000MB
          max-file-size: 1000MB
          max-request-size: 1000MB
      sleuth:
        web:
          client:
            enabled: true
        propagation:
          type: B3
      jpa:
        properties:
          hibernate:
            generate_statistics: false
      zipkin:
        enabled: false
      main:
        allow-bean-definition-overriding: true
    signatureServices:
      signatureIsAddedAsynchronouslyToContainer: true
      timeout: 30000
      cors:
        disabled: true
    containerController:
      illegalChars: "[\\\\/:*?\"<>|\\^\\&]"
      createNewContainer:
        documentData:
          containerExtensionJsonKey: "containerExtension"
          certInHexJsonKey: "certInHex"
          signatureProfileJsonKey: "signatureProfile"
          documentFilenameJsonKey: "documentFilename"
          documentMimeTypeJsonKey: "contentType"
          containerMimeTypeJsonKey: "containerContentType"
          documentTypeJsonKey: "documentType"
          objectNameJsonKey: "objectName"
    archive-services:
      baseUrl: http://dmss-archive-services:8090/api
      fallbackUrl: http://dmss-archive-services-fallback:8095/api
      forwardHttpHeaders: authorization, otcsticket, X-User-Context, X-Forwarded-For, X-Session-ID, X-Request-ID
      configuration:
        container:
          defaultMimeType: application/vnd.etsi.asic-e+zip
          defaultContainerExtension: .asice
          defaultDocumentType: Document
        dataToSign:
          mimeType: application/x-binary
          documentType: temp
          fileExtension: .bin
      saveBinFilesAllwaysInFallback: false
      fileMimeTypesAndExtensions: classpath:mime.types
    smartId:
      hostUrl: https://rp-api.smart-id.com/v3/
      relyingPartyUUID: ${relyingPartyUUID}
      relyingPartyName: ${relyingPartyName}
      delay: 3000
      trustedCertificates: classpath:trusted_certificates.jks
      trustAnchorsCertificates: classpath:sid_trusted_CA.jks
      schemaName: smart-id
      interactions:
        type: confirmationMessageAndVerificationCodeChoice
        display-text: ${displayText}
    hsm:
      enabled: false
      pkcs11ModulePath: "C:/1Program Files/SafeNet/LunaClient/cryptoki.dll"
      partitionPin: 
      slotIndex: 0
    hystrix:
      command:
        default:
          execution:
            isolation:
              thread:
                timeoutInMilliseconds: 100000
    digidoc4j:
      configuration:
        mode: PROD
        file: "/confs/digidoc4j-custom.yaml"
        preferAiaOcsp: true
        issuers:
    hazelcast:
      expireInminutes: 3
      members: localhost:5777
      port: 5777
      kubernetes:
        enabled: true
        kubernetesServiceDns: dmss-container-and-signature.default.svc.cluster.local
        service-dns: dmss-container-and-signature.default.svc.cluster.local
    idCard:
      useContainerIdAsSession: false
    lvrtc:
      baseUri: https://eidas.eparaksts.lv/
      clientId: ${clientId}
      clientSecret: ${clientSecret}
      authRedirectUri: ${signaturePersonUrl}/api/lvrtc-signing/sign-authorize/
      signRedirectUri: ${signaturePersonUrl}/api/lvrtc-signing/signing-identity/
      defaultLocale: lv
      tspUrl: https://tsa.eparaksts.lv/
      keystorePassword: 
      certAlias: 
      batchParallelism: 5
      useRedirectResponse: true
    logging:
      pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}/%X{spanId}] %-5p [%t] %logger{36} - %msg%n'
      level:
        root: DEBUG
        # Keep always debug
        ee.digitalmind: DEBUG
        # Suppress other noisy loggers
        org.apache.coyote.http11: INFO
        org.apache.tomcat: INFO
        org.apache.catalina: INFO
        org.apache.hc.client5.http: INFO
        org.apache.http.impl.conn.PoolingHttpClientConnectionManager: INFO
        com.hazelcast.spi.impl.operationservice.impl.InvocationMonitor: INFO
        com.hazelcast.internal: INFO
        org.springframework.web.servlet: INFO
        org.springframework.security.web: INFO
        org.springframework.orm.jpa: INFO
        org.hibernate.orm.core: INFO
        org.hibernate.session.metrics: INFO
        com.trustlynx.autoconfigure.RequestTracingFilter: INFO
        # Digidoc4j
        org.digidoc4j.impl.asic.tsl.LazyTslCertificateSource: INFO
    logRequests: false
    timestamp:
      timestampProviders:
        -
          tspSource: https://tsa-com.eparaksts.lv/
          authentications:
            - protocol: https
              host: tsa-com.eparaksts.lv
              port: 443
              scheme: Basic
              realm: KeyOneSystem
              username: username
              password: password
  digidoc4j-custom.yaml: |
    TRUSTED_TERRITORIES: EE, LV, LT
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmss-container-and-signature
  labels:
    app: dmss-container-and-signature
spec:
  selector:
    matchLabels:
      app: dmss-container-and-signature
  template:
    metadata:
      labels:
        app: dmss-container-and-signature
    spec:
      containers:
      - name: dmss-container-and-signature
        image: trustlynx/container-signature-service:26.15.1.0
        env:
        - name: SPRING_CONFIG_LOCATION
          value: /confs/application.yml
        - name: TZ
          value: Europe/Riga
        volumeMounts:
        - name: config
          mountPath: /confs/application.yml
          subPath: application.yml
        - name: config
          mountPath: /confs/digidoc4j-custom.yaml
          subPath: digidoc4j-custom.yaml
      volumes:
      - name: config
        configMap:
          name: dmss-container-and-signature-service
---
# Service for port 8092 (standard service)
apiVersion: v1
kind: Service
metadata:
  name: dmss-container-and-signature
  labels:
    app: dmss-container-and-signature
spec:
  type: ClusterIP
  ports:
  - port: 8092
  selector:
    app: dmss-container-and-signature
---
