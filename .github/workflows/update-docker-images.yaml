name: Update Kubernetes image

on:
  workflow_dispatch:
    inputs:
      file:
        description: Path to YAML file to update
        required: true
      image_suffix:
        description: Last part + tag (e.g. signatureconfiguration:597)
        required: true

jobs:
  bump-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Concurrent dispatches race on the push. Each attempt starts from the
      # latest remote tip and re-applies the edit, so a rejected push is
      # retried instead of being lost, and the run fails if it never lands.
      # No `concurrency:` on purpose: it keeps only one pending run and
      # cancels the rest, which would drop bumps.
      - name: Update image line and push
        env:
          FILE: ${{ inputs.file }}
          SUFFIX: ${{ inputs.image_suffix }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # Resulting line will be: image: ${registryURL}/<SUFFIX>
            sed -i "s|^\([[:space:]]*image:\s*\)\${registryURL}/.*|\1\${registryURL}/${SUFFIX}|" "$FILE"
            echo "Updated image in $FILE to \${registryURL}/${SUFFIX}"
            grep "image:" "$FILE"

            if git diff --quiet -- "$FILE"; then
              echo "$FILE already at ${SUFFIX}, nothing to push"
              exit 0
            fi

            git commit -q -m "Update image in $FILE to ${SUFFIX}" -- "$FILE"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying on a fresh tip"
            sleep $((attempt * 3))
          done

          echo "::error::Could not push $FILE -> ${SUFFIX} after 5 attempts"
          exit 1
